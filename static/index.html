<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Talk to Yash</title>
  <meta name="description" content="An AI voice bot Yash built to answer interview questions as him.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%236366f1'/%3E%3Crect x='26' y='14' width='12' height='24' rx='6' fill='white'/%3E%3Cpath d='M18 32a14 14 0 0 0 28 0M32 46v6' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <header class="head">
      <h1>Yash Rajput</h1>
      <p class="tagline">Ask me anything you'd ask in an interview</p>
      <p class="disclosure">An AI voice bot Yash built to answer as him.</p>
    </header>

    <div id="inapp-hint" class="banner" hidden>
      This in-app browser may block the microphone. Open this page in Chrome or Safari for voice, or just type below.
    </div>

    <section class="stage" aria-label="Voice controls">
      <button id="talk" class="talk" type="button" data-state="idle" aria-label="Tap to talk">
        <span class="ring" aria-hidden="true"></span>
        <svg class="icon icon-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a1 1 0 1 1 2 0 8 8 0 0 1-7 7.94V21a1 1 0 1 1-2 0v-2.06A8 8 0 0 1 4 11a1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"/></svg>
        <svg class="icon icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <p id="status" class="status" role="status" aria-live="polite">Tap to talk</p>
      <button id="stop" class="btn btn-ghost" type="button" hidden>Stop</button>
      <button id="retry" class="btn" type="button" hidden>Retry</button>
    </section>

    <section class="captions" aria-live="polite" aria-label="Conversation">
      <p id="q-caption" class="q" hidden></p>
      <p id="a-caption" class="a" hidden></p>
    </section>

    <section class="inputs">
      <div id="chips" class="chips" aria-label="Sample questions"></div>
      <form id="text-form" class="text-form" autocomplete="off">
        <label class="sr-only" for="text-input">Type your question</label>
        <input id="text-input" type="text" maxlength="500" placeholder="Or type your question…" enterkeyhint="send">
        <button class="btn" type="submit">Send</button>
      </form>
    </section>

    <aside id="debug" class="debug" hidden></aside>
  </main>
  <div id="toast" class="toast" role="alert" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
